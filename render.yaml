services:
  - type: web
    name: openslate
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:/data/data.db?mode=rwc
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DOMAIN
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
