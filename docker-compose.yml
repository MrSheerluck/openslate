services:
  openslate:
    build:
      context: .
      args:
        BUILD_FEATURES: ${BUILD_FEATURES:-backend-sqlx}
    ports:
      - "8080:8080"                        # local dev / IP-only
      # - "80:80"                           # uncomment for custom domain + HTTPS
      # - "443:443"                         # uncomment for custom domain + HTTPS
    volumes:
      - data:/data
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-sqlite:/data/data.db?mode=rwc}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      - DOMAIN=${DOMAIN}
      - R2_BUCKET=${R2_BUCKET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
    restart: unless-stopped

volumes:
  data:
